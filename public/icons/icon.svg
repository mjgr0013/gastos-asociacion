<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background for maskable icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Main Dice Body -->
  <g filter="url(#shadow)">
    <rect x="96" y="96" width="320" height="320" rx="64" fill="url(#diceGrad)" stroke="#cbd5e1" stroke-width="4"/>
    
    <!-- 5 Dice Pips (Points) -->
    <!-- Top-Left -->
    <circle cx="168" cy="168" r="28" fill="#1e3a8a"/>
    <!-- Top-Right -->
    <circle cx="344" cy="168" r="28" fill="#1e3a8a"/>
    <!-- Center (Golden Accent) -->
    <circle cx="256" cy="256" r="32" fill="#f59e0b"/>
    <!-- Bottom-Left -->
    <circle cx="168" cy="344" r="28" fill="#1e3a8a"/>
    <!-- Bottom-Right -->
    <circle cx="344" cy="344" r="28" fill="#1e3a8a"/>
  </g>
</svg>
